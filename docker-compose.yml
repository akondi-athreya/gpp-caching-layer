
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 30

  db-seed:
    build: ./app
    env_file: .env.example
    command: ["npm", "run", "seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  memcached:
    image: memcached:1.6-alpine
    command: ["memcached", "-m", "256", "-vv"]
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\r\n' | nc 127.0.0.1 11211 | grep -q VERSION"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: ./app
    env_file: .env.example
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      memcached:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    command: ["npm", "run", "dev"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30